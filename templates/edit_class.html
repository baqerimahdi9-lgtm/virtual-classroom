{% extends "base.html" %}
{% block title %}ویرایش کلاس{% endblock %}
{% block content %}

<div class="auth-box wide">
    <h2>✏️ ویرایش کلاس</h2>
    <form method="post">
        <label>عنوان *</label>
        <input type="text" name="title" value="{{ classroom.title }}" required>

        <label>توضیحات</label>
        <textarea name="description" rows="3">{{ classroom.description or '' }}</textarea>

        <label>دسته‌بندی</label>
        <input type="text" name="category" value="{{ classroom.category or '' }}">

        <label>لینک لایو *</label>
        <input type="url" name="meeting_url" value="{{ classroom.meeting_url }}" required>

        <label>لینک ویدیو</label>
        <input type="text" name="video_url" value="{{ classroom.video_url or '' }}">

        <label>نوع ویدیو</label>
        <select name="video_type">
            <option value="aparat" {% if classroom.video_type == 'aparat' %}selected{% endif %}>آپارات</option>
            <option value="youtube" {% if classroom.video_type == 'youtube' %}selected{% endif %}>یوتیوب</option>
            <option value="direct" {% if classroom.video_type == 'direct' %}selected{% endif %}>مستقیم</option>
        </select>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">ذخیره</button>
    </form>
</div>

{% endblock %}
