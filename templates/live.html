{% extends "base.html" %}
{% block title %}لایو{% endblock %}
{% block content %}

<div class="page-header">
    <h2>🔴 کلاس زنده: {{ classroom.title }}</h2>
    <a href="{{ url_for('classroom', class_id=classroom.id) }}" class="btn">بازگشت</a>
</div>

<div class="live-container">
    <iframe src="{{ classroom.meeting_url }}"
            allow="camera; microphone; fullscreen; display-capture; autoplay"
            class="live-iframe">
    </iframe>
</div>

{% endblock %}
